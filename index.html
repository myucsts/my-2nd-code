<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my-2nd-code 掲示板ログ</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: radial-gradient(circle at 10% 15%, rgba(255, 153, 0, 0.08), transparent 42%),
          radial-gradient(circle at 88% 5%, rgba(147, 51, 234, 0.12), transparent 48%),
          linear-gradient(180deg, #150b23 0%, #090313 100%);
        --card-bg: rgba(40, 22, 60, 0.78);
        --card-glow: rgba(249, 115, 22, 0.18);
        --text: #fdf1ff;
        --muted: #d0b4ff;
        --accent: #f97316;
        --accent-secondary: #8b5cf6;
        --accent-soft: rgba(249, 115, 22, 0.15);
        --border: rgba(252, 252, 255, 0.14);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        z-index: -1;
      }

      body::before {
        background:
          radial-gradient(circle at 15% 70%, rgba(139, 92, 246, 0.22), transparent 58%),
          radial-gradient(circle at 80% 20%, rgba(249, 115, 22, 0.28), transparent 62%);
        opacity: 0.9;
      }

      body::after {
        background-image: url("data:image/svg+xml,%3Csvg width='140' height='140' viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23f97316' fill-opacity='0.12'%3E%3Cpath d='M20 10c3 6 7 10 15 10s12-4 15-10c-3-6-7-10-15-10S23 4 20 10zM100 60c3 6 7 10 15 10s12-4 15-10c-3-6-7-10-15-10s-12 4-15 10z'/%3E%3C/g%3E%3Cg fill='%238b5cf6' fill-opacity='0.1'%3E%3Ccircle cx='40' cy='110' r='6'/%3E%3Ccircle cx='120' cy='30' r='6'/%3E%3C/g%3E%3C/svg%3E");
        background-size: 160px;
        opacity: 0.55;
      }

      header {
        padding: 1.8rem 1.4rem 1.2rem;
        background: linear-gradient(135deg, rgba(249, 115, 22, 0.92), rgba(76, 29, 149, 0.95));
        color: #fff;
        text-align: center;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.35);
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      }

      header::after {
        content: "";
        position: absolute;
        inset: -60% -20% auto -20%;
        height: 260px;
        background:
          radial-gradient(circle at 15% 40%, rgba(255, 255, 255, 0.18), transparent 55%),
          radial-gradient(circle at 85% 70%, rgba(249, 115, 22, 0.25), transparent 60%);
        transform: rotate(-8deg);
        opacity: 0.8;
      }

      header h1 {
        margin: 0 0 0.6rem;
        font-size: clamp(1.45rem, 4.6vw, 2.3rem);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-shadow: 0 4px 14px rgba(44, 0, 66, 0.45);
      }

      header p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.92);
      }

      header .actions {
        margin-top: 1.2rem;
        display: flex;
        gap: 0.6rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      header .actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        padding: 0.6rem 1.2rem;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        color: #160c24;
        background: rgba(255, 241, 186, 0.92);
        transition: transform 0.2s ease, box-shadow 0.2s ease,
          background 0.2s ease, color 0.2s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      }

      header .actions a.secondary {
        background: rgba(26, 5, 44, 0.35);
        color: #fff;
        box-shadow: none;
        border: 1px solid rgba(255, 255, 255, 0.32);
      }

      header .actions a:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.96);
        color: #5b21b6;
      }

      main {
        padding: clamp(1rem, 2.4vw, 2rem);
        flex: 1 1 auto;
        width: min(980px, 100%);
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      main::before {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        max-width: 85%;
        height: 60%;
        background: radial-gradient(circle at center, rgba(249, 115, 22, 0.18), transparent 70%);
        filter: blur(60px);
        opacity: 0.9;
        z-index: -1;
      }

      #issues {
        display: grid;
        gap: 1rem;
      }

      .issue-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.2rem;
        box-shadow: 0 22px 42px rgba(8, 4, 20, 0.45), 0 0 24px var(--card-glow);
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        backdrop-filter: blur(12px);
      }

      .issue-header {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .issue-title {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.5;
      }

      .issue-title a {
        color: var(--text);
        text-decoration: none;
        text-shadow: 0 2px 6px rgba(7, 0, 14, 0.45);
      }

      .issue-title a:hover {
        color: var(--accent);
      }

      .issue-meta {
        font-size: 0.88rem;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 0.75rem;
      }

      .label-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 8px 18px rgba(249, 115, 22, 0.32);
      }

      .label-badge.is-open {
        background: rgba(34, 197, 94, 0.22);
        color: #bbf7d0;
        border-color: rgba(16, 185, 129, 0.32);
        box-shadow: 0 8px 18px rgba(34, 197, 94, 0.24);
      }

      .label-badge.is-closed {
        background: rgba(244, 63, 94, 0.22);
        color: #fecdd3;
        border-color: rgba(244, 63, 94, 0.32);
        box-shadow: 0 8px 18px rgba(244, 63, 94, 0.26);
      }

      details {
        border-radius: 12px;
        border: 1px solid rgba(249, 115, 22, 0.25);
        background: rgba(22, 8, 36, 0.55);
        padding: 0.8rem 1rem;
        backdrop-filter: blur(8px);
      }

      details summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--accent);
        outline: none;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }

      details[open] summary {
        margin-bottom: 0.6rem;
      }

      .issue-body {
        font-size: 0.92rem;
        color: #f3e8ff;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .loading,
      .empty,
      .error {
        text-align: center;
        padding: 2rem 1.2rem;
        color: var(--muted);
        background: rgba(18, 6, 32, 0.72);
        border-radius: 16px;
        border: 1px dashed var(--border);
        box-shadow: 0 12px 28px rgba(5, 2, 14, 0.4);
        backdrop-filter: blur(10px);
      }

      footer {
        text-align: center;
        padding: 1.5rem 1rem 2rem;
        font-size: 0.88rem;
        color: var(--muted);
        background: rgba(12, 4, 24, 0.82);
        border-top: 1px solid var(--border);
        backdrop-filter: blur(12px);
      }

      footer a {
        color: var(--accent);
        text-decoration: none;
      }

      @media (min-width: 640px) {
        #issues {
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
      }

      @media (max-width: 480px) {
        header {
          padding: 1.6rem 1rem;
        }

        .issue-card {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎃 my-2nd-code ハロウィン掲示板 🎃</h1>
      <p>
        GitHub Issues をカラフルなハロウィン掲示板として活用しています。キャンディを交換する気分で、仮装ネタや近況を気軽に投稿してください。
      </p>
      <div class="actions">
        <a
          href="https://github.com/myucsts/my-2nd-code/issues/new"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub Issue で新しい投稿を作成"
          >新しい投稿を作成</a
        >
        <a
          class="secondary"
          href="https://github.com/myucsts/my-2nd-code/issues"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub Issue 一覧を開く"
          >GitHub Issue 一覧</a
        >
      </div>
    </header>

    <main>
      <section id="issues" aria-live="polite">
        <div class="loading">投稿を読み込んでいます…</div>
      </section>
    </main>

    <footer>
      GitHub API の状況により読み込みに時間がかかる場合があります。数分後にリロードしてみてください。
    </footer>

    <script>
      (async function loadIssues() {
        const issuesContainer = document.getElementById("issues");
        const api =
          "https://api.github.com/repos/myucsts/my-2nd-code/issues?state=all&per_page=50&direction=desc";

        const formatDate = (isoText) => {
          try {
            const date = new Date(isoText);
            return new Intl.DateTimeFormat("ja-JP", {
              year: "numeric",
              month: "short",
              day: "numeric",
              hour: "2-digit",
              minute: "2-digit",
            }).format(date);
          } catch (error) {
            return isoText;
          }
        };

        const createIssueCard = (issue) => {
          const card = document.createElement("article");
          card.className = "issue-card";

          const header = document.createElement("div");
          header.className = "issue-header";

          const title = document.createElement("h2");
          title.className = "issue-title";
          const link = document.createElement("a");
          link.href = issue.html_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = `#${issue.number} ${issue.title}`;
          title.appendChild(link);

          const meta = document.createElement("div");
          meta.className = "issue-meta";
          const state = document.createElement("span");
          state.className = "label-badge";
          const isOpen = issue.state === "open";
          state.classList.add(isOpen ? "is-open" : "is-closed");
          state.textContent = isOpen ? "OPEN" : "CLOSED";
          const user = document.createElement("span");
          user.textContent = `投稿者: ${issue.user?.login ?? "不明"}`;
          const created = document.createElement("span");
          created.textContent = `作成: ${formatDate(issue.created_at)}`;
          const updated = document.createElement("span");
          updated.textContent = `更新: ${formatDate(issue.updated_at)}`;

          meta.append(state, user, created, updated);

          const labelsFragment = document.createDocumentFragment();
          issue.labels?.forEach((label) => {
            const pill = document.createElement("span");
            pill.className = "label-badge";

            if (label.color) {
              pill.style.color = "#fff";
              pill.style.backgroundColor = `#${label.color}`;
            }

            pill.textContent = label.name ?? "label";
            labelsFragment.appendChild(pill);
          });

          const labelsContainer = document.createElement("div");
          labelsContainer.appendChild(labelsFragment);
          labelsContainer.style.display = labelsFragment.childNodes.length
            ? "flex"
            : "none";
          labelsContainer.style.flexWrap = "wrap";
          labelsContainer.style.gap = "0.4rem";

          header.append(title, meta);
          card.appendChild(header);
          if (labelsFragment.childNodes.length) {
            card.appendChild(labelsContainer);
          }

          if (issue.body) {
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            summary.textContent = "本文を開く";
            const bodyEl = document.createElement("div");
            bodyEl.className = "issue-body";
            bodyEl.textContent = issue.body;
            details.append(summary, bodyEl);
            card.appendChild(details);
          }

          return card;
        };

        try {
          const response = await fetch(api, {
            headers: {
              Accept: "application/vnd.github+json",
            },
          });

          if (!response.ok) {
            throw new Error(
              `GitHub API からの取得に失敗しました (status: ${response.status})`
            );
          }

          const payload = await response.json();
          const issues = payload.filter((entry) => !entry.pull_request);

          issuesContainer.innerHTML = "";

          if (!issues.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "まだ投稿がありません。GitHub Issue から投稿してください。";
            issuesContainer.appendChild(empty);
            return;
          }

          const fragment = document.createDocumentFragment();
          issues.forEach((issue) => fragment.appendChild(createIssueCard(issue)));
          issuesContainer.appendChild(fragment);
        } catch (error) {
          console.error(error);
          issuesContainer.innerHTML = "";
          const errorMessage = document.createElement("div");
          errorMessage.className = "error";
          errorMessage.innerHTML =
            "投稿の取得に失敗しました。しばらくしてから再読み込みしてください。<br />" +
            (error instanceof Error ? error.message : "");
          issuesContainer.appendChild(errorMessage);
        }
      })();
    </script>
  </body>
</html>
